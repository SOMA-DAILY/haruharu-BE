services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haruharu
      POSTGRES_USER: haruharu
      POSTGRES_PASSWORD: haruharu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haruharu -d haruharu"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/haruharu
      SPRING_DATASOURCE_USERNAME: haruharu
      SPRING_DATASOURCE_PASSWORD: haruharu
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
