spring:
  application:
    name: haruharu

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # JSON 네이밍 snake_case (API 명세 계약). DTO 필드는 camelCase 유지, @JsonProperty 명시 필드 우선.
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    # 요청 바디의 선택지형 enum을 대소문자 무시로 역직렬화 ("kakao" == "KAKAO"). 클라 계약의 관대함 유지.
    mapper:
      accept-case-insensitive-enums: true

# AWS S3 (프로필 이미지·영상 업로드). 자격증명 키는 미기재 — DefaultCredentialsProvider 사용.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # 업로드(PUT) presign 만료. 발급 직후 업로드하므로 짧게(5분).
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY:300}
    # 비공개 영상 재생(GET) presign 만료. 시청 세션을 고려해 넉넉히(1시간).
    video-get-expiry-seconds: ${AWS_S3_VIDEO_GET_EXPIRY:3600}

# FCM 서비스 계정 JSON(base64 한 줄). 미설정 시 no-op 발송 어댑터로 동작.
fcm:
  service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}

# 매칭 정책. enter-cost: 신청 차감 = 미성사 환불 = 불발 통지 개수(구름). 값 변경은 이 설정만 수정.
# 구름 경제(#143): 신청 20 / 완주 5+5+5 / 미매칭 위로 5 → 완주+미매칭 = 전액 환급(±0).
# 아래 4개 값은 하나의 불변식(전액 환급)이라 env 오버라이드 없이 yaml 리터럴로만 관리한다 — 변경은 PR로.
haruharu:
  matching:
    enter-cost: 20
  room:
    upload-reward:
      daily-completion:
        1: 5
        2: 5
        3: 5
    consolation-reward:
      amount: 5

oauth:
  providers:
    kakao:
      issuer: https://kauth.kakao.com
      public-key-uri: https://kauth.kakao.com/.well-known/jwks.json
    apple:
      issuer: https://appleid.apple.com
      public-key-uri: https://appleid.apple.com/auth/keys

portone:
  store-id: ${PORTONE_STORE_ID:}
  api-secret: ${PORTONE_V2_API_SECRET:}
  channel-key: ${PORTONE_CHANNEL_KEY:}

identity:
  encryption:
    key: ${IDENTITY_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
