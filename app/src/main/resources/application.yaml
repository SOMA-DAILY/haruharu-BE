spring:
  application:
    name: haruharu

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # 지우지 말 것 — DB 예외 메시지의 PII 유출을 막는 사실상 유일한 방어다(#259).
        # pgjdbc 기본값(true)이면 유니크 충돌 시 "Key (token)=(실제 FCM 토큰) already exists" 가
        # 예외 메시지에 실려 로그로 나간다. GlobalExceptionHandler 의 제약명 추출은
        # DataIntegrityViolationException 경로만 덮으므로, 스케줄러 스레드와 PushSendService
        # (하필 ux_device_tokens_token 충돌이 실제로 터지는 FCM 경로)는 이 한 줄에만 의존한다.
        logServerErrorDetail: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Spring Batch(#357) — 스케줄러를 배치 잡으로 전환. JDBC JobRepository=공유 RDS(멱등·이력의 좌표계).
  # BATCH_* 스키마 생성·JDBC JobRepository 배선은 BatchInfraConfig 에서 명시적으로 한다
  # (Boot 4.1 spring-boot-batch 모듈은 구 spring.batch.jdbc.* 스키마 자동 초기화를 제공하지 않음).
  batch:
    job:
      enabled: false              # 부팅 시 자동 실행 금지 — @Scheduled 런처가 유일한 트리거

  # Redis(#453) — STOMP 메시지를 모든 앱 인스턴스에 팬아웃하는 Pub/Sub 전용. 데이터 저장소로 쓰지 않는다.
  # 연결은 haruharu.chat.fanout.redis.enabled=true 일 때만 실제로 맺는다(false면 기존 인스턴스 로컬 전달).
  # timeout 을 짧게 둔다 — publish 는 커밋 후 요청 스레드에서 돌므로 Redis 장애가 메시지 전송 API 를 붙잡지 않게.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      repositories:
        enabled: false            # JPA 와 멀티 스토어 스캔 방지 — Redis Repository 미사용

  # JSON 네이밍 snake_case (API 명세 계약). DTO 필드는 camelCase 유지, @JsonProperty 명시 필드 우선.
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    # 요청 바디의 선택지형 enum을 대소문자 무시로 역직렬화 ("kakao" == "KAKAO"). 클라 계약의 관대함 유지.
    mapper:
      accept-case-insensitive-enums: true

# AWS S3 (프로필 이미지·영상 업로드). 자격증명 키는 미기재 — DefaultCredentialsProvider 사용.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # 업로드(PUT) presign 만료. 발급 직후 업로드하므로 짧게(5분).
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY:300}
    # 비공개 영상 재생(GET) presign 만료. 시청 세션을 고려해 넉넉히(1시간).
    video-get-expiry-seconds: ${AWS_S3_VIDEO_GET_EXPIRY:3600}
    # 비공개 프로필 이미지 조회(GET) presign 만료. 화면 세션 기준 1시간 — 클라이언트는 URL을 영구 캐시하지 않는다.
    image-get-expiry-seconds: ${AWS_S3_IMAGE_GET_EXPIRY:3600}

# FCM 서비스 계정 JSON(base64 한 줄). 미설정 시 no-op 발송 어댑터로 동작.
fcm:
  service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}

# 매칭 정책. enter-cost: 신청 차감 = 미성사 환불 = 불발 통지 개수(구름). 값 변경은 이 설정만 수정.
# 구름 경제(#143): 신청 20 / 완주 5+5+5 / 미매칭 위로 5 → 완주+미매칭 = 전액 환급(±0).
# 아래 4개 값은 하나의 불변식(전액 환급)이라 env 오버라이드 없이 yaml 리터럴로만 관리한다 — 변경은 PR로.
haruharu:
  application:
    commit-sha: ${APPLICATION_COMMIT_SHA:unknown}
  chat:
    fanout:
      # STOMP 브로드캐스트를 Redis Pub/Sub 로 모든 인스턴스에 퍼뜨린다(#453). 앱이 2대 이상이면 true 필수.
      # false(기본)면 인스턴스 로컬 simpleBroker 로만 전달 — 단일 인스턴스·로컬·테스트는 Redis 없이 동작.
      redis:
        enabled: ${CHAT_FANOUT_REDIS_ENABLED:false}
        channel: ${CHAT_FANOUT_REDIS_CHANNEL:chat:broadcast}
  batch:
    # 내부 배치 트리거 API(#389) — 외부 오케스트레이터(Airflow)용 X-Internal-Token 공유 시크릿.
    # 비어 있으면 /internal/batch/** 는 전부 401(fail-closed). 이 경로는 ALB/VPC 에서 외부 차단이 1차 방어다.
    internal:
      token: ${INTERNAL_BATCH_TOKEN:}
    # 알림 정리 @Scheduled 런처 토글. Airflow 가 스케줄을 맡으면 false — Job 빈은 남아 트리거 API 로 실행된다.
    notification-cleanup:
      scheduler:
        enabled: ${NOTIFICATION_CLEANUP_SCHEDULER_ENABLED:true}
  notification:
    # 야간 푸시 차단(#429). [start, end) KST 에는 FCM 발송만 건너뛴다(알림함 저장은 유지, 막힌 푸시는 버림).
    quiet-hours:
      enabled: ${NOTIFICATION_QUIET_HOURS_ENABLED:true}
      start: ${NOTIFICATION_QUIET_HOURS_START:00:00}
      end: ${NOTIFICATION_QUIET_HOURS_END:08:00}
    # 슬롯 시작 푸시 배치 런처(#440). enabled=false 면 스케줄 launch 만 끈다(Job 빈은 남음).
    # cron: 미션 배정(매분 0초)·outcome(매분 30초)과 같은 초에 두지 말 것 — JobRepository SERIALIZABLE 충돌로 한쪽이 실행되지 못한다.
    slot-start:
      enabled: ${SLOT_START_NOTIFICATION_ENABLED:true}
      cron: ${SLOT_START_NOTIFICATION_CRON:15 0 * * * *}
  mission:
    assignment:
      enabled: ${MISSION_ASSIGNMENT_ENABLED:true}
      lead-minutes: ${MISSION_ASSIGNMENT_LEAD_MINUTES:60}
      batch-size: ${MISSION_ASSIGNMENT_BATCH_SIZE:100}
      cron: ${MISSION_ASSIGNMENT_CRON:0 * * * * *}
      # 활성 배정 정책. RANDOM_V1 은 Rule V1 효과 비교용 대조군으로 남겨둔다.
      policy: ${MISSION_ASSIGNMENT_POLICY:RULE_V1}
    # settle-minutes: 시간창 종료 후 집계까지 두는 여유. 활동 이벤트가 AFTER_COMMIT이라 지연 도착분을 놓치지 않는다.
    # cron: assignment(매분 0초)와 같은 초에 두지 말 것. Spring Batch JobRepository 는 SERIALIZABLE 로
    #       메타데이터를 쓰므로 두 잡이 동시에 launch 하면 직렬화 충돌로 한쪽이 아예 실행되지 못한다.
    outcome:
      enabled: ${MISSION_OUTCOME_ENABLED:true}
      settle-minutes: ${MISSION_OUTCOME_SETTLE_MINUTES:5}
      batch-size: ${MISSION_OUTCOME_BATCH_SIZE:100}
      cron: ${MISSION_OUTCOME_CRON:30 * * * * *}
  # 첫 가입 1회 보너스 구름(#232). 정책값은 코드 @DefaultValue가 아닌 이 yaml 리터럴로 관리(matching.enter-cost와 동일 방침).
  coin:
    signup-bonus: 20
    enabled: false  # 코인 경제 비활성(#309 피벗). 가입 보너스·코인 API off. 되살릴 때만 true
  matching:
    enter-cost: 20
    enabled: false  # 자동매칭 비활성(#308 피벗). 되살릴 때만 true
  payment:
    enabled: false  # 결제(IAP) 비활성(#309 피벗). webhook·상품 API off. 되살릴 때만 true
  room:
    consolation-reward:
      amount: 5

oauth:
  providers:
    kakao:
      issuer: https://kauth.kakao.com
      public-key-uri: https://kauth.kakao.com/.well-known/jwks.json
    apple:
      issuer: https://appleid.apple.com
      public-key-uri: https://appleid.apple.com/auth/keys

portone:
  store-id: ${PORTONE_STORE_ID:}
  api-secret: ${PORTONE_V2_API_SECRET:}
  channel-key: ${PORTONE_CHANNEL_KEY:}

identity:
  encryption:
    key: ${IDENTITY_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Redis 장애는 실시간 전달만 늦출 뿐 서비스 불능이 아니다(#453). health 에 포함되면 Redis 순단에
  # ALB/ECS 헬스체크가 실패해 앱 태스크 전체가 교체되므로 제외한다.
  health:
    redis:
      enabled: false

# 심사용 데모(#352). 데모 피드 영상은 고정 S3 자산 하나를 재사용한다(DB 행은 로그인 시점 생성).
# video-url 미설정이면 영상 없이 촬영 CTA만 노출된다.
demo:
  provider-id: ${DEMO_PROVIDER_ID:haruharu-demo}
  feed:
    video-url: ${DEMO_FEED_VIDEO_URL:}
    thumbnail-url: ${DEMO_FEED_THUMBNAIL_URL:https://picsum.photos/seed/haruharu-demo-feed/600/800}

# 요청 단위 식별자를 모든 로그에 노출한다(#257). 값은 MdcLoggingFilter가 심는다.
# traceId는 ALB가 주입한 X-Amzn-Trace-Id — ALB access log와 같은 키라 두 로그를 조인할 수 있다.
# level 패턴을 오버라이드하는 방식은 Spring Boot 권장(Micrometer Tracing도 동일 방식).
# 구조화 로그(logging.structured.format=ecs) 전환 시에는 MDC가 최상위 필드로 자동 승격되어 이 패턴이 무시된다.
logging:
  pattern:
    level: "%5p [%X{traceId:--}/%X{userId:--}]"
