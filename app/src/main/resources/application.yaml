spring:
  application:
    name: haruharu

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # 지우지 말 것 — DB 예외 메시지의 PII 유출을 막는 사실상 유일한 방어다(#259).
        # pgjdbc 기본값(true)이면 유니크 충돌 시 "Key (token)=(실제 FCM 토큰) already exists" 가
        # 예외 메시지에 실려 로그로 나간다. GlobalExceptionHandler 의 제약명 추출은
        # DataIntegrityViolationException 경로만 덮으므로, 스케줄러 스레드와 PushSendService
        # (하필 ux_device_tokens_token 충돌이 실제로 터지는 FCM 경로)는 이 한 줄에만 의존한다.
        logServerErrorDetail: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # JSON 네이밍 snake_case (API 명세 계약). DTO 필드는 camelCase 유지, @JsonProperty 명시 필드 우선.
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    # 요청 바디의 선택지형 enum을 대소문자 무시로 역직렬화 ("kakao" == "KAKAO"). 클라 계약의 관대함 유지.
    mapper:
      accept-case-insensitive-enums: true

# AWS S3 (프로필 이미지·영상 업로드). 자격증명 키는 미기재 — DefaultCredentialsProvider 사용.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # 업로드(PUT) presign 만료. 발급 직후 업로드하므로 짧게(5분).
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY:300}
    # 비공개 영상 재생(GET) presign 만료. 시청 세션을 고려해 넉넉히(1시간).
    video-get-expiry-seconds: ${AWS_S3_VIDEO_GET_EXPIRY:3600}
    # 비공개 프로필 이미지 조회(GET) presign 만료. 화면 세션 기준 1시간 — 클라이언트는 URL을 영구 캐시하지 않는다.
    image-get-expiry-seconds: ${AWS_S3_IMAGE_GET_EXPIRY:3600}

# FCM 서비스 계정 JSON(base64 한 줄). 미설정 시 no-op 발송 어댑터로 동작.
fcm:
  service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}

# 매칭 정책. enter-cost: 신청 차감 = 미성사 환불 = 불발 통지 개수(구름). 값 변경은 이 설정만 수정.
# 구름 경제(#143): 신청 20 / 완주 5+5+5 / 미매칭 위로 5 → 완주+미매칭 = 전액 환급(±0).
# 아래 4개 값은 하나의 불변식(전액 환급)이라 env 오버라이드 없이 yaml 리터럴로만 관리한다 — 변경은 PR로.
haruharu:
  # 첫 가입 1회 보너스 구름(#232). 정책값은 코드 @DefaultValue가 아닌 이 yaml 리터럴로 관리(matching.enter-cost와 동일 방침).
  coin:
    signup-bonus: 20
    enabled: false  # 코인 경제 비활성(#309 피벗). 가입 보너스·코인 API off. 되살릴 때만 true
  matching:
    enter-cost: 20
    enabled: false  # 자동매칭 비활성(#308 피벗). 되살릴 때만 true
  payment:
    enabled: false  # 결제(IAP) 비활성(#309 피벗). webhook·상품 API off. 되살릴 때만 true
  room:
    upload-reward:
      # 업로드 보상 비활성(#309 피벗): 완주 보상 없음(amountFor→0→미지급). 되살릴 때 day별 값 채움.
      daily-completion: {}
    consolation-reward:
      amount: 5

oauth:
  providers:
    kakao:
      issuer: https://kauth.kakao.com
      public-key-uri: https://kauth.kakao.com/.well-known/jwks.json
    apple:
      issuer: https://appleid.apple.com
      public-key-uri: https://appleid.apple.com/auth/keys

portone:
  store-id: ${PORTONE_STORE_ID:}
  api-secret: ${PORTONE_V2_API_SECRET:}
  channel-key: ${PORTONE_CHANNEL_KEY:}

identity:
  encryption:
    key: ${IDENTITY_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 요청 단위 식별자를 모든 로그에 노출한다(#257). 값은 MdcLoggingFilter가 심는다.
# traceId는 ALB가 주입한 X-Amzn-Trace-Id — ALB access log와 같은 키라 두 로그를 조인할 수 있다.
# level 패턴을 오버라이드하는 방식은 Spring Boot 권장(Micrometer Tracing도 동일 방식).
# 구조화 로그(logging.structured.format=ecs) 전환 시에는 MDC가 최상위 필드로 자동 승격되어 이 패턴이 무시된다.
logging:
  pattern:
    level: "%5p [%X{traceId:--}/%X{userId:--}]"
