spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 2592000000

revenuecat:
  webhook-secret: ${REVENUECAT_WEBHOOK_SECRET}
  accept-sandbox: false  # 운영은 실결제만 적립한다(#492). 샌드박스 이벤트는 기록만 남긴다

oauth:
  providers:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
    apple:
      client-id: ${APPLE_CLIENT_ID}

# 배포 프로파일은 콘솔 로그를 JSON 1줄/이벤트로 구조화(Datadog 수집용). Boot 4 네이티브 구조화 로깅이라
# 별도 인코더 의존성 불필요. MDC(traceId·userId)와 APM의 dd.trace_id가 필드로 자동 포함된다.
# 로컬(default 프로파일)은 application.yaml의 사람이 읽는 패턴 유지. admin 모듈은 무영향.
logging:
  structured:
    format:
      console: logstash
