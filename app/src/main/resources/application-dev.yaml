spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 5184000000
  refresh-token-expiry-ms: 5184000000

revenuecat:
  webhook-secret: ${REVENUECAT_WEBHOOK_SECRET}

oauth:
  providers:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
    apple:
      client-id: ${APPLE_CLIENT_ID}
