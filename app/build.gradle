plugins {
    id 'org.springframework.boot'
}

// 실행형 boot jar만 산출물로 둔다(plain jar 비활성) — Docker COPY 시 *.jar 모호성 제거.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    // 여러 Spring/JPA 컨텍스트를 재사용하는 전체 실행에서 발생한 512 MiB 힙 부족을 방지한다(#562).
    maxHeapSize = '1g'
    def diagnosticDir = layout.buildDirectory.dir('reports/test-jvm').get().asFile
    doFirst {
        diagnosticDir.mkdirs()
    }
    // OOM 뒤 응답 없이 남지 않도록 실패 종료하고 모듈별 GC 로그를 보존한다.
    jvmArgs '-XX:+ExitOnOutOfMemoryError',
            "-Xlog:gc*:file=${diagnosticDir}/gc-%p.log:time,level,tags:filecount=2,filesize=10M"
    testLogging.exceptionFormat = 'full'
}

// app = 유저용 서버(ECS APP). HTTP·WebSocket(STOMP)·스케줄러·유저 시큐리티 담당.
dependencies {
    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // STOMP 멀티 인스턴스 팬아웃(#453) — Redis Pub/Sub(Lettuce)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // API 문서
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
}
