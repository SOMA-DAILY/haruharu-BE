// Usage: ./gradlew -I scripts/diagnostics/test-context-profile.init.gradle \
//   -DtestContextProfileDir=/tmp/context-before :app:test
// This adds a diagnostic listener to this invocation only; normal test classpaths are unchanged.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def output = new File(System.getProperty('testContextProfileDir', '/tmp/haruharu-test-context-profile'))
    def classes = app.layout.buildDirectory.dir('diagnostics/context-profiler/classes')
    def resources = app.layout.buildDirectory.dir('diagnostics/context-profiler/resources')
    def compile = app.tasks.register('compileContextProfiler', JavaCompile) {
        source new File(System.getProperty('testContextProfilerSource',
                app.rootProject.file('scripts/diagnostics/TestContextMetrics.java').absolutePath))
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = classes
        options.release = 21
    }
    // CI 반복 실험은 app뿐 아니라 모든 모듈의 테스트를 매번 실행한다.
    def eventsPath = System.getProperty('testContextTaskEvents')
    if (eventsPath != null) {
        def events = new File(eventsPath)
        app.rootProject.allprojects { project ->
            project.tasks.withType(Test).configureEach {
                outputs.upToDateWhen { false }
                outputs.doNotCacheIf('Repeated context experiment') { true }
                doFirst {
                    events << groovy.json.JsonOutput.toJson([
                            event: 'start', task: path, epochMillis: System.currentTimeMillis()]) + '\n'
                }
            }
        }
        gradle.taskGraph.afterTask { task, state ->
            if (task instanceof Test) {
                events << groovy.json.JsonOutput.toJson([
                        event: 'finish', task: task.path, epochMillis: System.currentTimeMillis(),
                        skipped: state.skipped, upToDate: state.upToDate,
                        failure: state.failure != null]) + '\n'
            }
        }
    }
    app.tasks.named('test', Test) {
        dependsOn compile
        classpath += app.files(classes, resources)
        systemProperty 'test.context.metrics', new File(output, 'contexts.tsv').absolutePath
        systemProperty 'logging.level.org.springframework.test.context.cache', 'TRACE'
        outputs.upToDateWhen { false }
        def startedAt
        def startedAtMillis
        doFirst {
            if (maxHeapSize != '1g') {
                throw new GradleException("Expected unchanged app maxHeapSize=1g, found ${maxHeapSize}")
            }
            if (output.exists() && output.list().length > 0) {
                throw new GradleException("Profile output must be empty; choose a new testContextProfileDir: ${output}")
            }
            output.mkdirs()
            def metadata = new File(resources.get().asFile, 'META-INF/spring.factories')
            metadata.parentFile.mkdirs()
            metadata.text = 'org.springframework.boot.SpringApplicationRunListener=org.son.haruharu.diagnostics.TestContextMetrics\n'
            startedAt = System.nanoTime()
            startedAtMillis = System.currentTimeMillis()
        }
        doLast {
            new File(output, 'task-seconds.txt').text = ((System.nanoTime() - startedAt) / 1_000_000_000d).toString()
            app.copy {
                from app.layout.buildDirectory.dir('test-results/test')
                include '*.xml'
                into new File(output, 'test-results')
            }
            app.copy {
                from app.fileTree(app.layout.buildDirectory.dir('reports/test-jvm')).files.findAll {
                    it.name.startsWith('gc-') && it.lastModified() >= startedAtMillis
                }
                into new File(output, 'gc')
            }
        }
    }
}
