spring:
  application:
    name: haruharu

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # JSON 네이밍 snake_case (API 명세 계약). DTO 필드는 camelCase 유지, @JsonProperty 명시 필드 우선.
  jackson:
    property-naming-strategy: SNAKE_CASE

# AWS S3 (프로필 이미지·영상 업로드). 자격증명 키는 미기재 — DefaultCredentialsProvider 사용.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY:300}

jwt:
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 2592000000

oauth:
  providers:
    kakao:
      issuer: https://kauth.kakao.com
      public-key-uri: https://kauth.kakao.com/.well-known/jwks.json
    apple:
      issuer: https://appleid.apple.com
      public-key-uri: https://appleid.apple.com/auth/keys

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
