spring:
  application:
    name: haruharu

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

jwt:
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 2592000000

oauth:
  providers:
    kakao:
      issuer: https://kauth.kakao.com
      public-key-uri: https://kauth.kakao.com/.well-known/jwks.json
    apple:
      issuer: https://appleid.apple.com
      public-key-uri: https://appleid.apple.com/auth/keys
