spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

oauth:
  providers:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
    apple:
      client-id: ${APPLE_CLIENT_ID}
