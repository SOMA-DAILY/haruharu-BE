name: Deploy (ECS)

# 수동 배포. 선택한 이미지 태그(SHA 권장)로 app·admin task def 새 리비전을 등록하고 서비스를 업데이트한다.
# build-once-promote: develop 에서 빌드된 동일 이미지를 dev→prod 로 승격한다.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        required: true
        type: choice
        options: [dev, prod]
      target:
        description: '배포 대상 (admin은 관리자 서버만 배포)'
        required: true
        type: choice
        options: [all, admin]
        default: all
      image_tag:
        description: '배포할 이미지 태그 (SHA 권장, 비우면 develop 무빙 태그)'
        required: false
        default: ''
      depth_image_tag:
        description: 'AI 작업기 Depth 사이드카 이미지 태그 (비우면 지금 이미지 유지)'
        required: false
        default: ''

run-name: deploy-ecs ${{ inputs.environment }} ${{ inputs.target || 'all' }} @ ${{ inputs.image_tag || 'develop' }}

concurrency:
  group: deploy-ecs-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC 로 AWS 역할 assume
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 049705857590.dkr.ecr.ap-northeast-2.amazonaws.com
  CLUSTER: haruharu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::049705857590:role/github-actions-deploy-policy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve env → task def family / service
        id: map
        env:
          DEPLOY_TARGET: ${{ inputs.target || 'all' }}
        run: |
          TAG="${{ inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="develop"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_TARGET" != "all" ] && [ "$DEPLOY_TARGET" != "admin" ]; then
            echo "Unsupported deploy target" >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "app_family=haruharu-app"            >> "$GITHUB_OUTPUT"
            echo "admin_family=haruharu-admin"         >> "$GITHUB_OUTPUT"
            echo "app_service=haruharu-app-svc-prod"   >> "$GITHUB_OUTPUT"
            echo "admin_service=haruharu-admin-svc-prod" >> "$GITHUB_OUTPUT"
            # airflow 는 아직 dev 만(#405). prod 는 dev 안정 후 별도 이슈.
            echo "airflow_family="                     >> "$GITHUB_OUTPUT"
            echo "airflow_service="                    >> "$GITHUB_OUTPUT"
          else
            echo "app_family=haruharu-app-dev"         >> "$GITHUB_OUTPUT"
            echo "admin_family=haruharu-admin-dev"      >> "$GITHUB_OUTPUT"
            echo "app_service=haruharu-app-svc-dev"     >> "$GITHUB_OUTPUT"
            echo "admin_service=haruharu-admin-svc-dev" >> "$GITHUB_OUTPUT"
            echo "airflow_family=haruharu-airflow-dev"  >> "$GITHUB_OUTPUT"
            echo "airflow_service=haruharu-airflow-svc-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Record before service versions
        run: |
          aws ecs describe-services --cluster "${{ env.CLUSTER }}" \
            --services "${{ steps.map.outputs.app_service }}" "${{ steps.map.outputs.admin_service }}" \
            --query 'services[].{service:serviceName,task:taskDefinition,running:runningCount,desired:desiredCount}' \
            --output json > ecs-before.json
          cat ecs-before.json
          for TASK in $(jq -r '.[].task' ecs-before.json); do
            aws ecs describe-task-definition --task-definition "$TASK" \
              --query 'taskDefinition.{task:taskDefinitionArn,containers:containerDefinitions[].{name:name,image:image}}' \
              --output json
          done

      - name: Deploy app
        if: inputs.target != 'admin'
        run: |
          bash .github/scripts/deploy-ecs-service.sh \
            "${{ steps.map.outputs.app_family }}" "app" \
            "${{ env.ECR_REGISTRY }}/haruharu-app:${{ steps.map.outputs.tag }}" \
            "${{ steps.map.outputs.app_service }}"

      - name: Deploy admin
        run: |
          bash .github/scripts/deploy-ecs-service.sh \
            "${{ steps.map.outputs.admin_family }}" "admin" \
            "${{ env.ECR_REGISTRY }}/haruharu-admin:${{ steps.map.outputs.tag }}" \
            "${{ steps.map.outputs.admin_service }}"

      # AI 작업기(#558): 같은 SHA 로 추천 서비스와 월 1회 개선 루프 작업 정의를 올린다. 작업기 스택이 없는 환경은 건너뛴다.
      # Depth 사이드카(#559)는 depth_image_tag 를 줄 때만 바꾼다(그 SHA 에 depth 이미지가 있어야 한다).
      - name: Deploy ai-worker
        id: ai_worker
        if: inputs.target != 'admin'
        env:
          DEPTH_TAG: ${{ inputs.depth_image_tag }}
        run: |
          DEPTH_IMAGE=""
          [ -n "$DEPTH_TAG" ] && DEPTH_IMAGE="${{ env.ECR_REGISTRY }}/haruharu-ai-worker-depth:${DEPTH_TAG}"
          bash .github/scripts/deploy-ai-worker.sh "${{ inputs.environment }}" \
            "${{ env.ECR_REGISTRY }}/haruharu-ai-worker:${{ steps.map.outputs.tag }}" "$DEPTH_IMAGE"

      # Airflow(#405): 컨테이너 5개(init·api-server·scheduler·dag-processor·triggerer)가 같은 이미지라 ALL 로 전부 교체.
      - name: Deploy airflow
        if: inputs.target != 'admin' && steps.map.outputs.airflow_service != ''
        run: |
          bash .github/scripts/deploy-ecs-service.sh \
            "${{ steps.map.outputs.airflow_family }}" "ALL" \
            "${{ env.ECR_REGISTRY }}/haruharu-airflow:${{ steps.map.outputs.tag }}" \
            "${{ steps.map.outputs.airflow_service }}"

      - name: Wait for services stable
        run: |
          if [ "${{ inputs.target }}" = "admin" ]; then
            SERVICES="${{ steps.map.outputs.admin_service }}"
          else
            SERVICES="${{ steps.map.outputs.app_service }} ${{ steps.map.outputs.admin_service }} ${{ steps.map.outputs.airflow_service }}"
            if [ "${{ steps.ai_worker.outputs.deployed }}" = "true" ]; then
              SERVICES="$SERVICES ${{ steps.ai_worker.outputs.service }}"
            fi
          fi
          aws ecs wait services-stable --cluster "${{ env.CLUSTER }}" --services $SERVICES
          echo "✅ ${{ inputs.environment }} 배포 완료 (tag=${{ steps.map.outputs.tag }})"

      - name: Record after service versions
        run: |
          aws ecs describe-services --cluster "${{ env.CLUSTER }}" \
            --services "${{ steps.map.outputs.app_service }}" "${{ steps.map.outputs.admin_service }}" \
            --query 'services[].{service:serviceName,task:taskDefinition,running:runningCount,desired:desiredCount}' \
            --output json > ecs-after.json
          cat ecs-after.json
          for TASK in $(jq -r '.[].task' ecs-after.json); do
            aws ecs describe-task-definition --task-definition "$TASK" \
              --query 'taskDefinition.{task:taskDefinitionArn,containers:containerDefinitions[].{name:name,image:image}}' \
              --output json
          done

      - name: Save deployment service versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-service-versions-${{ inputs.environment }}-${{ github.run_id }}
          path: ecs-*.json
          retention-days: 7
