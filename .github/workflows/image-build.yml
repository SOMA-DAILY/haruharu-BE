name: Build & Push Image

# develop/main 으로 향한 PR이 "머지"될 때만 트리거 (직접 push 는 무시)
on:
  pull_request:
    types: [closed]
    branches: [develop, main]

concurrency:
  group: image-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (lowercase) & branch tag
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MODULE=app
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          # 캐시 export(reserve) 실패가 job 전체를 죽이지 않도록 무시. 이미지 빌드·푸시는 이미 성공 상태.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build and push (admin)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MODULE=admin
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}-admin
            ${{ steps.meta.outputs.image }}:${{ github.sha }}-admin
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
