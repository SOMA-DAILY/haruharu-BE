spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 운영에서는 어드민 API 문서를 노출하지 않는다(무인증 열람 방지).
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 운영 CORS는 fail-closed: env(ADMIN_CORS_ALLOWED_ORIGINS) 미설정 시 빈 값 → 전 오리진 차단.
# (base yaml의 dev 기본값 http://localhost:5173 이 운영에 새어들지 않게 명시적으로 재정의)
admin:
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:}

# 배포 프로파일은 콘솔 로그를 JSON 1줄/이벤트로 구조화(Datadog 수집용). Boot 4 네이티브 구조화 로깅이라
# 별도 인코더 의존성 불필요. admin은 MDC 미적용이라 traceId/userId 필드는 없다(저트래픽 내부 툴로 허용).
# 로컬(default 프로파일)은 application.yaml의 사람이 읽는 패턴 유지.
logging:
  structured:
    format:
      console: logstash
