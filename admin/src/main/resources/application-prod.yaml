spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 운영에서는 어드민 API 문서를 노출하지 않는다(무인증 열람 방지).
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 운영 CORS는 fail-closed: env(ADMIN_CORS_ALLOWED_ORIGINS) 미설정 시 빈 값 → 전 오리진 차단.
# (base yaml의 dev 기본값 http://localhost:5173 이 운영에 새어들지 않게 명시적으로 재정의)
admin:
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:}
