spring:
  application:
    name: haruharu-admin

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # 유저 서버와 동일 방침(#259). 서버 에러 DETAIL 에 실리는 컬럼 실제 값의 로그 노출을 드라이버 레벨에서 막는다.
        logServerErrorDetail: false

  jpa:
    # 어드민은 스키마를 소유하지 않는다(app이 소유). 스키마 변경/검증을 하지 않음.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # 유저 서버와 동일한 JSON 계약(snake_case).
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    mapper:
      accept-case-insensitive-enums: true

# 어드민 전용 JWT(유저 JWT와 분리된 시크릿) + 최초 SUPER 부트스트랩.
admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET}
    access-token-expiry-ms: 1800000
    refresh-token-expiry-ms: 2592000000
  bootstrap:
    # 계정 0건일 때만 최초 SUPER를 생성한다(둘 다 있어야 동작).
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    # 브라우저 어드민 프런트 오리진 화이트리스트(콤마 구분). 기본은 로컬 Vite dev, prod는 env로 주입.
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 채팅 P0(#455). admin 서버는 편성 저장만 하고 발송은 app 서버 잡이 한다 — 이 블록은 app 과 값을 맞춰두는 용도(바인딩 안 함).
haruharu:
  chat:
    admin-message:
      enabled: ${CHAT_ADMIN_MESSAGE_ENABLED:false}
    reply-push:
      enabled: ${CHAT_REPLY_PUSH_ENABLED:false}
    system-user-id: ${CHAT_SYSTEM_USER_ID:}

# 유저 서버(8080)와 포트 분리.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY:300}
    video-get-expiry-seconds: ${AWS_S3_VIDEO_GET_EXPIRY:3600}
    image-get-expiry-seconds: ${AWS_S3_IMAGE_GET_EXPIRY:3600}

server:
  port: ${ADMIN_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
