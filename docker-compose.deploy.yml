# EC2 배포 전용 compose. (로컬 개발은 docker-compose.yml 사용)
# - postgres 미포함: DB는 외부 RDS를 .env의 DB_URL로 주입
# - 이미지는 GHCR에서 pull (APP_IMAGE 는 deploy.yml 이 .env 에 주입)
# - 모든 환경값은 같은 디렉토리의 .env 파일에서 로드
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    ports:
      # 호스트 포트는 APP_PORT(.env)로 주입. 컨테이너 내부는 앱 고정 8080.
      - "${APP_PORT}:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 어드민 서버(별도 bootJar). 같은 RDS를 공유하고 호스트 8081로 노출한다.
  # 컨테이너 내부·호스트 모두 8081(어드민 앱 기본 server.port). 공용 .env를 로드한다.
  admin:
    image: ${ADMIN_IMAGE}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT}:8081"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
